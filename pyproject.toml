[project]
name = "readwell"
version = "0.1.0"
description = "Self-hosted feed aggregator with LLM topic filtering. Serves clean Atom feeds to any RSS reader."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "feedgen>=1.0",
    "trafilatura>=2.0",
    "pypdf>=5.0",
]

[project.scripts]
readwell = "readwell.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["readwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
