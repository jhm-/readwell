# Documents at sequentially numbered URLs (e.g. orders-in-council). Each run continues after
# the last number found; the first run catches up silently (baseline) unless baseline: false.

id: example-orders
name: Example orders-in-council
kind: numbered
url_template: "https://laws.example.gov/orders/{year}/{year}-{n:04d}.pdf"
start: { year: 2026, n: 1 }
title: "Example OIC {year}/{n:02d}"   # the act named in the text is appended
expect: pdf                           # pdf | html
probe_ahead: 5                        # consecutive missing numbers before stopping
year_rollover: true
doc_type: oic
interval_min: 720
filter: { mode: llm }
