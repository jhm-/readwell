# A source file can hold one source, a list, or {defaults, sources} as here.
# 'url' can be any page on the site: Readwell finds the feed. Set 'feed_url' to skip discovery.
defaults:
  kind: feed
  interval_min: 60

sources:
  - id: example-news            # lowercase letters, digits, '-' or '_'
    name: Example News
    url: https://news.example.com/
    tags: [news]

  - id: example-trade-press
    name: Example Trade Press
    feed_url: https://trade.example.com/rss.xml
    interval_min: 30
    tags: [trade]
    filter:
      mode: topics              # topics (default) | llm | keywords | none
      topics: [local-housing]   # screen only against these topics (default: all)
      threshold: 7              # stricter than the topics' own thresholds for this noisy source
      keywords_add: { local-housing: [secondary suite] }   # extra prefilter terms, this source only
      mute: [sponsored, "/^Podcast:/"]                      # dropped before screening (words or /regex/)
      max_per_day: 5            # keep only its 5 best matches per day
      note: "trade press; mostly about builders"            # context given to the LLM

  - id: example-essays
    name: Example Essays
    url: https://essays.example.org/
    tags: [general-interest]
    filter: { mode: none }      # unfiltered: never screened
    deliver_to: [main]          # always appears in the 'main' view
