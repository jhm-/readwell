# Readwell settings. Copy to $READWELL_CONFIG_DIR/config.yaml; every key is optional.
server:
  host: 0.0.0.0
  port: 8080
  base_url: http://readwell.local:8080   # how readers reach this server (used in generated links)

fetch:
  user_agent: "Readwell/0.1 (personal feed reader)"   # avoid URLs here: some CDNs treat "+http…" UAs as bots
  timeout_s: 30
  max_concurrency: 8        # requests in flight across all hosts
  per_host_delay_s: 1.0     # minimum gap between requests to the same host
  max_backoff_hours: 24     # failing sources retry at interval × 2^failures, up to this

worker:
  tick_s: 30                # how often the worker looks for due sources
  default_interval_min: 60  # for sources that don't set interval_min

feeds:
  title: Readwell
  max_entries: 200
  max_age_days: 30

health:
  failure_threshold: 5      # consecutive failures before a source appears in health.atom
                            # (missing feeds and unreadable feeds appear immediately)

dedupe:
  url_window_days: 14       # same canonical URL within this window = same story
  title_window_hours: 72    # near-identical headlines within this window = same story
  min_title_words: 5        # shorter headlines never match ("Weather" ≠ "Weather")
  title_containment: 0.9    # share of the shorter headline's words that must appear in the other

retention:
  content_days: 90          # article bodies are dropped after this; titles, links and scores stay
  backups_keep: 14

# --- Screening (Phase 3) ---------------------------------------------------
# The LLM backend is pluggable; pick the API format your provider speaks.
#   anthropic  Anthropic Messages API: Claude, or a Claude-to-Gemini proxy (set base_url)
#   gemini     Gemini's own API (direct, or a proxy that forwards it)
#   openai     OpenAI-compatible chat completions: OpenAI, xAI Grok, OpenRouter, Ollama, ...
#   none       no LLM; items wait as "deferred"
# The key, if the endpoint needs one, goes in /etc/readwell/env as READWELL_LLM_KEY=… (never here).
llm:
  backend: gemini
  model: gemini-3.1-flash-lite
  # base_url: http://192.168.1.100:8082   # a proxy; default is the provider's own endpoint
  api_key_env: READWELL_LLM_KEY
  thinking_level: minimal   # gemini backend only; dropped automatically if the model refuses it
  max_output_tokens: 4096
  price_in_per_m: 0.25      # USD per 1M input tokens — set to your model's price
  price_out_per_m: 1.50     # USD per 1M output tokens (thinking tokens count as output)
  daily_budget_usd: 1.00    # hard cap; past it, items wait ("deferred") until tomorrow
  budget_tz: America/Vancouver
  batch_size: 10            # items per LLM call
  max_words: 600            # text sent per article
  doc_max_words: 1200       # per OIC / gazette / document
  max_batches_per_tick: 6

screen:
  prefilter_floor: 0.15     # items with no topic keyword score at least this skip the LLM ("dropped")
  keyword_threshold: 0.3    # sources with filter mode 'keywords' land in a topic at this score
  max_age_days: 3           # older items aren't screened
  feedback_examples: 4      # 👍 and 👎 examples per topic shown to the LLM
  summarize_doc_types: [oic, gazette]   # these get a 2-3 sentence LLM summary

supernote:                  # 📄 Send to Supernote
  dir: /mnt/Data/Supernote/Document/Saved Articles
  page_size: Letter         # any CSS page size: A5, "157mm 210mm", ...
